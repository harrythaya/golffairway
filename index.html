<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fairway</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0F3D2A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=Cormorant+Garamond:ital,wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#E6F2E3;--surface:#F8FCF6;--ink:#0F2E1F;--muted:#2F5240;--line:#BFDBC2;--accent:#0B7F4F;--onaccent:#FFFFFF;--sand:#E6D8A0;--fairway:#B5DF98;--green:#6FCB63;--water:#86C5E0;--c1:#0B7F4F;--c2:#14532D;--c3:#2E8B1F;--c4:#4F8200;--c5:#00796B;--onbtn:#FFFFFF;--sa:#5FA9E6;--sb:#3F78BE;--sc:#D6ECF7;--sd:#F7CF8C;--h1:#D0EAC4;--h2:#B2DE9F;--h3:#8ACD73;--glow:radial-gradient(circle,#FFFBE0 0 14%,rgba(255,243,176,.75) 26%,rgba(255,226,130,0) 68%);--veil:linear-gradient(rgba(244,251,241,.3),rgba(244,251,241,.62));
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1A12;--surface:#12281C;--ink:#E8F5EA;--muted:#9FBFA9;--line:#244633;--accent:#4ADE80;--onaccent:#07140D;--sand:#8A7A44;--fairway:#1F4A2E;--green:#2F7A3F;--water:#1F5A73;--c1:#34D399;--c2:#A3E635;--c3:#4ADE80;--c4:#86EFAC;--c5:#2DD4BF;--onbtn:#07140D;--sa:#040B16;--sb:#02060C;--sc:#11323A;--sd:#1C4B45;--h1:#14301F;--h2:#1B3F2A;--h3:#235235;--glow:radial-gradient(circle,#F2F8FF 0 16%,rgba(200,225,255,.35) 30%,rgba(200,225,255,0) 66%);--veil:linear-gradient(rgba(5,14,10,.25),rgba(5,14,10,.5))}}
:root[data-theme="dark"]{--bg:#0B1A12;--surface:#12281C;--ink:#E8F5EA;--muted:#9FBFA9;--line:#244633;--accent:#4ADE80;--onaccent:#07140D;--sand:#8A7A44;--fairway:#1F4A2E;--green:#2F7A3F;--water:#1F5A73;--c1:#34D399;--c2:#A3E635;--c3:#4ADE80;--c4:#86EFAC;--c5:#2DD4BF;--onbtn:#07140D;--sa:#040B16;--sb:#02060C;--sc:#11323A;--sd:#1C4B45;--h1:#14301F;--h2:#1B3F2A;--h3:#235235;--glow:radial-gradient(circle,#F2F8FF 0 16%,rgba(200,225,255,.35) 30%,rgba(200,225,255,0) 66%);--veil:linear-gradient(rgba(5,14,10,.25),rgba(5,14,10,.5))}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 "Bricolage Grotesque",system-ui,sans-serif;display:flex;flex-direction:column;max-width:520px;margin:0 auto}
header{display:flex;align-items:center;gap:14px;padding:20px 20px 18px;background:linear-gradient(160deg,#0F3D2A,#06231A);border-bottom:3px solid #8BE04A;border-radius:0 0 22px 22px}header .logo{width:58px;height:58px;flex:none}header h1{font-family:"Cormorant Garamond",Georgia,serif;font-size:42px;font-weight:700;letter-spacing:.07em;line-height:1;margin:0;color:#D6F58A;background:linear-gradient(180deg,#EAFFA8,#7BD83A);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}header .sub{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:18px;letter-spacing:.05em;color:#A8D9B5;margin-top:4px}
h1{font-size:26px;font-weight:800;margin:0;letter-spacing:-.02em}
h2{font-size:20px;font-weight:600;margin:0 0 4px}
p{margin:0 0 12px}
.sub{color:var(--muted);font-size:14px}
main{flex:1;overflow-y:auto;padding:8px 20px 20px}
nav{display:flex;border-top:1px solid var(--line);background:var(--surface)}
nav button{flex:1;padding:12px 4px;border:0;background:none;color:var(--muted);font:600 14px inherit;font-family:inherit;cursor:pointer}
nav button[aria-selected="true"]{color:var(--tc);box-shadow:inset 0 3px 0 var(--tc)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.list button.row{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:16px;margin-bottom:8px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:600 17px inherit;font-family:inherit;cursor:pointer}
.row small{color:var(--muted);font-weight:400;font-size:14px}
.btn{padding:12px 18px;border:0;border-radius:10px;background:var(--accent);color:var(--onaccent);font:600 16px inherit;font-family:inherit;cursor:pointer}
.btn.ghost{background:none;color:var(--accent);border:1px solid var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.steps{padding-left:0;list-style:none;margin:12px 0}
.steps li{padding:12px 0;border-bottom:1px solid var(--line)}
.steps b{display:block}
.back{background:none;border:0;color:var(--accent);font:600 15px inherit;font-family:inherit;padding:8px 0;cursor:pointer}
svg.hole{width:100%;border-radius:12px;background:var(--fairway);touch-action:manipulation;cursor:crosshair}
.shots{margin:8px 0;padding:0;list-style:none;font-size:15px}
.shots li{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
.chat{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.msg{padding:10px 14px;border-radius:14px;max-width:85%}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--onaccent)}
.msg.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line)}
.inputrow{display:flex;gap:8px}
input{flex:1;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chips button{padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);font:14px inherit;font-family:inherit;cursor:pointer}
.tag{display:inline-block;font-size:13px;color:var(--muted)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:4px 0 12px}
.bar i{display:block;height:100%;background:var(--accent)}
.btn{background:var(--tc,var(--accent));color:var(--onbtn)}.row{border-left:5px solid var(--gc,var(--line))!important}.chip{display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:50%;flex:none;color:var(--gc);background:color-mix(in srgb,var(--gc) 16%,var(--surface))}.list button.row{gap:12px}.nm{flex:1}.msg.me{background:var(--c2);color:var(--onbtn)}
#bg{position:fixed;top:0;bottom:0;left:0;right:0;margin:0 auto;width:100%;max-width:520px;z-index:-1;overflow:hidden;pointer-events:none;--p:0;--s:0;background:linear-gradient(180deg,color-mix(in srgb,var(--sa) calc((1 - var(--p))*100%),var(--sb)),color-mix(in srgb,var(--sc) calc((1 - var(--p))*100%),var(--sd)))}
#bg .sun{position:absolute;width:300px;height:300px;left:calc(55% - 150px + var(--p)*10%);top:calc(14% + var(--p)*30%);background:var(--glow)}
#bg .lyr{position:absolute;inset:0}
#bg .lyr svg{display:block;width:100%;height:100%;overflow:visible}
#bg .cl{transform:translateX(calc(var(--s)*.1px))}
#bg .fa{transform:translateY(calc(var(--s)*-.015px))}
#bg .tr{transform:translateY(calc(var(--s)*-.03px))}
#bg .cs{transform:translateY(calc(var(--s)*-.06px))}
#bg .fg{transform:translateY(calc(var(--s)*-.12px))}
#bg .tint{position:absolute;inset:0;background:linear-gradient(rgba(255,140,40,0),rgba(255,120,30,.9));mix-blend-mode:multiply;opacity:calc(var(--p)*.3)}
#bg::after{content:"";position:absolute;inset:0;background:var(--veil)}
#bg .ph{position:absolute;inset:-6% 0;background:center/cover no-repeat;display:none;transform:translateY(calc(var(--s)*-.04px))}
#bg.photo .ph{display:block}#bg.photo .lyr,#bg.photo .sun{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #bg .lyr{filter:brightness(.42) saturate(.9)}:root:not([data-theme="light"]) #bg .tint{display:none}}
:root[data-theme="dark"] #bg .lyr{filter:brightness(.42) saturate(.9)}:root[data-theme="dark"] #bg .tint{display:none}
@media (prefers-reduced-motion:reduce){#bg .lyr{transform:none!important}}
html{background:var(--bg)}
</style>
</head>

759L25 772L28 756L32 772L35 765L39 772L42 766L46 772L49 762L53 772L56 756L60 772L63 757L67 772L70 756L74 772L77 759L81 772L84 762L88 772L91 760L95 772L98 756L102 772L105 761L109 772L112 766L116 772L119 759L123 772L126 761L130 772L133 764L137 772L140 757L144 772L147 765L151 772L154 759L158 772L161 766L165 772L168 763L172 772L175 762L179 772L182 764L186 772L189 763L193 772L196 760L200 772L203 760L207 772L210 759L214 772L217 765L221 772L224 764L228 772L231 759L235 772L238 760L242 772L245 758L249 772L252 762L256 772L259 764L263 772L266 760L270 772L273 758L277 772L280 762L284 772L287 760L291 772L294 761L298 772L301 756L305 772L308 760L312 772L315 763L319 772L322 764L326 772L329 765L333 772L336 764L340 772L343 764L347 772L350 763L354 772L357 756L361 772L364 763L368 772L371 766L375 772L378 759L382 772L385 757L389 772L392 764L396 772L399 762L403 772L406 762L410 772L413 766L417 772L420 764L424 772L420 1000Z" fill="#2E8B3C"/><path d="M-10 1000L-10 784L-7 772L-3 784L0 770L4 784L7 773L11 784L14 769L18 784L21 769L25 784L28 773L32 784L35 776L39 784L42 770L46 784L49 769L53 784L56 768L60 784L63 768L67 784L70 778L74 784L77 771L81 784L84 768L88 784L91 770L95 784L98 772L102 784L105 772L109 784L112 772L116 784L119 772L123 784L126 777L130 784L133 771L137 784L140 768L144 784L147 772L151 784L154 778L158 784L161 775L165 784L168 777L172 784L175 775L179 784L182 771L186 784L189 776L193 784L196 777L200 784L203 773L207 784L210 769L214 784L217 778L221 784L224 777L228 784L231 778L235 784L238 769L242 784L245 776L249 784L252 770L256 784L259 777L263 784L266 773L270 784L273 769L277 784L280 778L284 784L287 777L291 784L294 775L298 784L301 769L305 784L308 772L312 784L315 776L319 784L322 768L326 784L329 774L333 784L336 773L340 784L343 769L347 784L350 773L354 784L357 771L361 784L364 777L368 784L371 777L375 784L378 771L382 784L385 771L389 784L392 771L396 784L399 771L403 784L406 774L410 784L413 777L417 784L420 776L424 784L420 1000Z" fill="#226B2E"/></svg></div><div class="tint"></div></div>
<header><svg class="logo" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="47" fill="#0A2A1D" stroke="#A3E635" stroke-width="3"/><circle cx="50" cy="50" r="41" fill="none" stroke="#A3E635" stroke-width=".8" opacity=".6"/><circle cx="56" cy="40" r="19" fill="#7BD83A"/><path d="M20 70Q50 54 80 70L80 75Q50 83 20 75Z" fill="#1DB36B"/><rect x="49" y="22" width="2.4" height="42" fill="#F4FFE8"/><path d="M51.4 22L72 30L51.4 38Z" fill="#F4FFE8"/><circle cx="36" cy="69" r="3.2" fill="#F4FFE8"/></svg><div><h1>Fairway</h1><div class="sub">Your golf coach</div></div></header>
<main id="view"></main>
<nav role="tablist" id="tabs"></nav>
<script>
const T={
wood:[["Stance","Feet just outside shoulder width, ball off your front heel."],["Tilt","Lean slightly away from the target so you sweep the ball up."],["Backswing","Turn your shoulders, keep your lead arm long, club parallel at the top."],["Downswing","Start with the hips, let the arms follow."],["Finish","Weight on your front foot, belt buckle facing the target."]],
hybrid:[["Stance","Feet shoulder width, ball slightly ahead of center."],["Setup","Stand a little closer than with a long iron, hands level with the ball."],["Swing","Swing like an iron: a smooth sweeping strike, not a steep chop."],["Finish","Hold the finish and stay balanced on your front foot."]],
long:[["Stance","Feet shoulder width, ball just ahead of center."],["Posture","Hinge at the hips, back straight, arms hanging freely."],["Backswing","Full shoulder turn, keep the tempo smooth."],["Impact","Sweep the ball off the turf, don’t try to lift it."],["Finish","Chest to the target, balanced for a full second."]],
mid:[["Stance","Feet shoulder width, ball in the middle of your stance."],["Posture","Hinge at the hips, back straight, arms hanging freely."],["Backswing","Three-quarter turn, wrists set halfway up."],["Impact","Hands slightly ahead of the ball, hit down so you strike the ball first, then the turf."],["Finish","Chest to the target, balanced for a full second."]],
short:[["Stance","Slightly narrower than shoulder width, ball just behind center."],["Setup","Weight a touch forward, hands ahead of the ball."],["Backswing","Three-quarter turn, controlled tempo."],["Impact","Hit down and through, taking a small divot after the ball."],["Finish","Hold it. A balanced finish means a controlled swing."]],
wedge:[["Stance","Narrow feet, 60% of weight on your front foot."],["Setup","Ball center, hands slightly forward."],["Swing","Hip-high to hip-high, keep the pace smooth."],["Finish","Hold the finish so you control distance."]],
sand:[["Stance","Open your stance and clubface, dig your feet in."],["Aim","Pick a spot 2 inches behind the ball."],["Swing","Full, committed swing. Slide the club under the ball."],["Finish","Follow through high. The sand lifts the ball out, not the club."]],
putt:[["Stance","Eyes over the ball, feet shoulder width."],["Grip","Light pressure, thumbs down the flat of the grip."],["Stroke","Rock the shoulders like a pendulum, no wrist."],["Finish","Make the follow-through as long as the backstroke."]]};
const G=[["Woods",[["Driver","Longest club, off the tee","wood"],["3-wood","Long tee shots and fairway shots","wood"],["5-wood","Easier to launch than a 3-wood","wood"]]],
["Hybrids",[["3-hybrid","Replaces a long iron","hybrid"],["4-hybrid","Forgiving from the rough","hybrid"]]],
["Irons",[["3-iron","Longest iron, low flight","long"],["4-iron","Long approach shots","long"],["5-iron","Mid-long approach shots","long"],["6-iron","Mid approach shots","mid"],["7-iron","Your all-round iron","mid"],["8-iron","Shorter approach shots","short"],["9-iron","High, soft landings","short"]]],
["Wedges",[["Pitching wedge","Short approach shots","wedge"],["Gap wedge","Fills the gap to your sand wedge","wedge"],["Sand wedge","Bunkers and short shots","sand"],["Lob wedge","High, soft shots over hazards","wedge"]]],
["Putter",[["Putter","On the green","putt"]]]];
const GC={Woods:"var(--c1)",Hybrids:"var(--c2)",Irons:"var(--c3)",Wedges:"var(--c4)",Putter:"var(--c5)"};
const KIND={wood:"wood",hybrid:"hybrid",long:"iron",mid:"iron",short:"iron",wedge:"wedge",sand:"sand",putt:"putter"};
function icon(k){const f='fill="currentColor"';const b={wood:`<path d="M5 31Q3 24 12 24L25 26Q30 28 25 34L11 35Q5 35 5 31Z" ${f}/>`,hybrid:`<path d="M7 32Q6 27 13 27L24 29Q27 31 24 34L12 35Q7 35 7 32Z" ${f}/>`,iron:`<path d="M7 35L8 28L25 27L26 34Z" ${f}/>`,wedge:`<path d="M8 35L12 27L26 29L26 35Z" ${f}/>`,sand:`<path d="M8 35L12 27L26 29L26 35Z" ${f}/><circle cx="32" cy="34" r="1.6" ${f}/><circle cx="35" cy="31" r="1.3" ${f}/><circle cx="29" cy="37" r="1.2" ${f}/>`,putter:`<path d="M7 33H29V37H7Z" ${f}/>`}[k];const sh=k==="putter"?"M24 4V33":"M29 4L21 28";return `<svg viewBox="0 0 40 40" width="28" height="28" aria-hidden="true">${b}<path d="${sh}" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg>`}
const clubs={};G.forEach(g=>g[1].forEach(c=>clubs[c[0]]={note:c[1],steps:T[c[2]],gc:GC[g[0]],kind:KIND[c[2]]}));
/* ADD YOUR VIDEOS HERE. YouTube: "yt:VIDEO_ID". Uploaded file: "videos/7-iron.mp4". */
const VIDEOS={"Driver":"","3-wood":"","5-wood":"","3-hybrid":"","4-hybrid":"","3-iron":"","4-iron":"","5-iron":"","6-iron":"","7-iron":"","8-iron":"","9-iron":"","Pitching wedge":"","Gap wedge":"","Sand wedge":"","Lob wedge":"","Putter":""};
function vid(n){const v=VIDEOS[n]||"";
if(v.startsWith("yt:"))return `<div style="position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden;margin-bottom:12px"><iframe src="https://www.youtube-nocookie.com/embed/${v.slice(3)}" title="${n} technique video" style="position:absolute;inset:0;width:100%;height:100%;border:0" allow="encrypted-media;picture-in-picture;fullscreen" allowfullscreen loading="lazy"></iframe></div>`;
if(v)return `<video src="${v}" controls playsinline preload="metadata" style="width:100%;border-radius:12px;margin-bottom:12px"></video>`;
return `<div class="card" style="text-align:center"><svg viewBox="0 0 200 90" width="100%" role="img" aria-label="Swing path diagram"><path d="M30 75 Q60 5 110 20 T175 70" fill="none" stroke="var(--accent)" stroke-width="3" stroke-dasharray="5 5"/><circle cx="110" cy="78" r="5" fill="var(--ink)"/><text x="100" y="12" font-size="9" fill="var(--muted)" text-anchor="middle">Video coming soon</text></svg></div>`}
const gear=[["Driver","From $200–$600"],["Iron set","From $400–$1,200"],["Putter","From $80–$400"],["Golf glove","From $15"],["Rangefinder","From $150"],["Golf balls (dozen)","From $25"]];
const replies=[[/slice/,"A slice usually means an open clubface at impact or an outside-in swing path. Try a stronger grip (rotate both hands slightly away from the target) and feel the club swing out toward right field on the way down."],[/putt/,"Keep your head still until the ball is gone, and match your backstroke length to the distance. Practice 3-foot putts until you make ten in a row."],[/driver|tee/,"Tee the ball so half of it is above the driver’s crown, and strike it on a slight upswing. Wider stance, smooth tempo."],[/chip|short/,"Use a narrow stance, weight forward, and rock the shoulders. Pick a landing spot and let the ball roll out."],[/club|which/,"A rough guide: driver off the tee, 7-iron for 140–150 yards, pitching wedge around 100–120. Your own carry distances matter more, so track them on the course tab."]];
const tabs=[["swings","Swings","var(--c3)"],["track","Analyze","var(--c1)"],["course","Course","var(--c4)"],["shop","Gear","var(--c5)"],["coach","Coach","var(--c2)"]];
let tab="swings",club=null,shots=[],chat=[["ai","Hi, I’m your golf coach. Ask me about your swing, club choice, or short game."]],analyzed=false;
const $=s=>document.querySelector(s),view=$("#view");
function renderTabs(){$("#tabs").innerHTML=tabs.map(([k,l,c])=>`<button role="tab" style="--tc:${c}" aria-selected="${k===tab}" data-t="${k}">${l}</button>`).join("");$("#tabs").onclick=e=>{const t=e.target.dataset.t;if(t){tab=t;club=null;render()}}}
function render(){renderTabs();view.style.setProperty("--tc",tabs.find(t=>t[0]===tab)[2]);({swings,track,course,shop,coach})[tab]();}
function swings(){
if(club){const c=clubs[club];view.innerHTML=`<button class="back" id="b">‹ All clubs</button><h2 style="color:${c.gc};display:flex;align-items:center;gap:10px"><span class="chip" style="--gc:${c.gc}">${icon(c.kind)}</span>${club}</h2><p class="sub">${c.note}</p>${vid(club)}<ol class="steps" style="--gc:${c.gc}">${c.steps.map(s=>`<li><b style="color:${c.gc}">${s[0]}</b>${s[1]}</li>`).join("")}</ol>`;$("#b").onclick=()=>{club=null;swings()};return}
view.innerHTML=`<h2>Pick a club</h2><p class="sub">Tap one to see the technique.</p>${G.map(g=>`<h3 style="font-size:15px;color:${GC[g[0]]};margin:16px 0 8px">${g[0]}</h3><div class="list">${g[1].map(c=>`<button class="row" data-c="${c[0]}" style="--gc:${GC[g[0]]}"><span class="chip">${icon(KIND[c[2]])}</span><span class="nm">${c[0]}<br><small>${c[1]}</small></span><span aria-hidden="true">›</span></button>`).join("")}</div>`).join("")}`;
view.onclick=e=>{const b=e.target.closest("[data-c]");if(b){club=b.dataset.c;swings()}}}
function track(){
view.onclick=null;
view.innerHTML=`<h2>Analyze your swing</h2><p class="sub">Film your swing from behind or the side. Scores below are samples until real analysis is added.</p><input type="file" accept="video/*" capture="environment" id="vid" hidden><button class="btn" id="rec">Record a swing</button><video id="pv" controls playsinline style="width:100%;margin-top:16px;border-radius:12px;display:none"></video><div id="res"></div>`;
$("#rec").onclick=()=>$("#vid").click();
$("#vid").onchange=e=>{const f=e.target.files[0];if(!f)return;const v=$("#pv");v.src=URL.createObjectURL(f);v.style.display="block";$("#rec").textContent="Record again";$("#res").innerHTML=`<div class="card" style="margin-top:16px"><b>Sample results</b><p class="tag">Real scoring would come from pose detection on your video.</p>${[["Tempo",78],["Hip rotation",55],["Head stability",84],["Follow-through",62]].map(([n,v],i)=>`<div>${n} <span class="tag">${v}/100</span></div><div class="bar"><i style="width:${v}%;background:var(--c${i+1})"></i></div>`).join("")}<p><b>Work on:</b> hip rotation. Try the 7-iron drill: start the downswing with your hips, not your arms.</p></div>`}}
function course(){
view.innerHTML=`<h2>Track your round</h2><p class="sub">Tap the hole map where each shot lands. Hole 1, par 4, 380 yards.</p><svg class="hole" id="map" viewBox="0 0 300 400" role="img" aria-label="Hole map. Tap to mark a shot."><path d="M110 380 C90 300 130 240 120 160 C115 110 140 70 150 50 L190 50 C200 80 190 130 185 170 C180 250 190 310 175 380Z" fill="var(--green)" opacity=".7"/><ellipse cx="170" cy="55" rx="34" ry="26" fill="var(--green)"/><circle cx="170" cy="52" r="3" fill="var(--ink)"/><ellipse cx="215" cy="95" rx="16" ry="10" fill="var(--sand)"/><ellipse cx="75" cy="200" rx="30" ry="18" fill="var(--water)"/><rect x="132" y="372" width="40" height="10" rx="3" fill="var(--ink)"/><g id="pts"></g></svg><ul class="shots" id="sl"></ul><div style="display:flex;gap:8px"><button class="btn ghost" id="un">Undo</button><button class="btn ghost" id="cl">Clear</button></div>`;
const map=$("#map"),pts=$("#pts"),sl=$("#sl");const start={x:152,y:377};
function draw(){let p=start,h="",l="";shots.forEach((s,i)=>{const d=Math.round(Math.hypot(s.x-p.x,s.y-p.y)*0.95);h+=`<line x1="${p.x}" y1="${p.y}" x2="${s.x}" y2="${s.y}" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="4 3"/><circle cx="${s.x}" cy="${s.y}" r="7" fill="var(--accent)"/><text x="${s.x}" y="${s.y+3.5}" font-size="9" fill="var(--onaccent)" text-anchor="middle">${i+1}</text>`;l+=`<li><span>Shot ${i+1}</span><b>${d} yds</b></li>`;p=s});pts.innerHTML=h;sl.innerHTML=l||'<li class="sub">No shots yet.</li>'}
map.onclick=e=>{const r=map.getBoundingClientRect();shots.push({x:(e.clientX-r.left)/r.width*300,y:(e.clientY-r.top)/r.height*400});draw()};
$("#un").onclick=()=>{shots.pop();draw()};$("#cl").onclick=()=>{shots=[];draw()};draw()}
function shop(){view.onclick=null;view.innerHTML=`<h2>Gear</h2><p class="sub">In the real app, each item links out to a retailer and you earn a small commission.</p><div class="list">${gear.map((g,i)=>`<button class="row" style="--gc:var(--c${i%5+1})"><span>${g[0]}<br><small>${g[1]}</small></span><span aria-hidden="true">›</span></button>`).join("")}</div>`}
function coach(){
view.onclick=null;
const esc=t=>t.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const paint=()=>{$("#ch").innerHTML=chat.map(m=>`<div class="msg ${m[0]}">${m[1]}</div>`).join("");view.scrollTop=view.scrollHeight};
view.innerHTML=`<h2>Golf coach</h2><p class="sub">Ask anything about your game.</p><div class="chat" id="ch"></div><div class="chips">${["Why do I slice?","Help my putting","Which club?"].map(q=>`<button>${q}</button>`).join("")}</div><div class="inputrow"><input id="q" placeholder="Ask your coach" aria-label="Message"><button class="btn" id="s">Send</button></div>`;
let busy=false;
const send=async t=>{t=t.trim();if(!t||busy)return;busy=true;chat.push(["me",esc(t),t]);chat.push(["ai","Thinking…"]);paint();
let reply;
try{const r=await fetch("/.netlify/functions/coach",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:chat.slice(1,-1).map(m=>({role:m[0]==="me"?"user":"assistant",content:m[2]}))})});if(!r.ok)throw 0;reply=(await r.json()).reply}
catch(_){const x=replies.find(x=>x[0].test(t.toLowerCase()));reply=x?x[1]:"I can’t reach the coach right now. Check your connection and try again."}
chat[chat.length-1]=["ai",esc(reply),reply];busy=false;paint()};
$("#s").onclick=()=>{send($("#q").value);$("#q").value=""};$("#q").onkeydown=e=>{if(e.key==="Enter")$("#s").click()};
document.querySelector(".chips").onclick=e=>{if(e.target.tagName==="BUTTON")send(e.target.textContent)};paint()}
const bgEl=$("#bg");const upd=()=>{const m=view,max=m.scrollHeight-m.clientHeight;bgEl.style.setProperty("--s",Math.min(m.scrollTop,500));bgEl.style.setProperty("--p",max>20?Math.min(m.scrollTop/max,1):0)};
view.addEventListener("scroll",upd,{passive:true});
new MutationObserver(upd).observe(view,{childList:true});
{const im=new Image();im.onload=()=>{$("#bg .ph").style.backgroundImage="url(bg-course.jpg)";bgEl.classList.add("photo")};im.src="bg-course.jpg"}
render();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
